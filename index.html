<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PicaView</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 图层：静图用 canvas，动图用 img，两层叠加做交叉淡入 -->
    <div id="stage">
      <div id="lightbox-mask"></div>
      <div id="lightbox-hint" class="hidden">欢迎使用 PicaView 照片查看器 · Esc 或点击图片外退出灯箱</div>
      <canvas id="view-a"></canvas>
      <canvas id="view-b"></canvas>
      <img id="view-anim" alt="" draggable="false" />
      <div id="checker"></div>
      <div id="loading" class="hidden"><div class="spinner"></div></div>
      <div id="load-error" class="hidden">
        <div id="load-error-msg"></div>
        <div class="load-error-hint">换一张试试，或按 → 翻页</div>
      </div>
      <div id="toast" class="hidden"></div>
      <div id="drop-hint" class="hidden"><span>松开以打开图片</span></div>
    </div>

    <!-- 空状态提示 -->
    <div id="empty" class="hidden">
      <div class="empty-icon">🖼</div>
      <div class="empty-title">PicaView</div>
      <div class="empty-hint">把图片拖到这里，双击或点击下方按钮选择图片</div>
      <button type="button" id="btn-open" class="empty-btn" aria-label="打开图片…">打开图片…</button>
    </div>

    <!-- 信息浮层（左下） -->
    <div id="infobar">
      <div id="info-name"></div>
      <div id="info-meta"></div>
    </div>

    <!-- 缩放百分比指示（右下，缩放时短暂显示） -->
    <div id="zoom-indicator" class="hidden"></div>

    <!-- 底部胶片条 -->
    <div id="filmstrip" class="hidden">
      <div id="thumbs"></div>
    </div>

    <!-- 主控制按钮（右下）+ 缩放滑块 -->
    <div id="controls">
      <select id="sort-mode" title="排序方式" aria-label="排序方式">
        <option value="name">名称 ↑</option>
        <option value="name_desc">名称 ↓</option>
        <option value="modified">修改时间</option>
        <option value="size">文件大小</option>
      </select>
      <input id="zoom-slider" type="range" min="0" max="100" step="0.5" title="缩放比例" aria-label="缩放比例" />
      <span id="zoom-pct">100%</span>
      <button type="button" id="btn-rot-ccw" title="向左旋转 (L)" aria-label="向左旋转 (L)"></button>
      <button type="button" id="btn-rot-cw" title="向右旋转 (R)" aria-label="向右旋转 (R)"></button>
      <button type="button" id="btn-details" title="详细信息 (D)" aria-label="详细信息 (D)" aria-controls="details-panel" aria-expanded="false"></button>
      <button type="button" id="btn-slideshow" title="幻灯片 (S)" aria-label="幻灯片 (S)"></button>
      <button type="button" id="btn-mask" title="蒙板：图片外压暗 (M)" aria-label="蒙板：图片外压暗 (M)"></button>
      <button type="button" id="btn-frameless" title="只看图片：隐藏标题栏 (B)" aria-label="只看图片：隐藏标题栏 (B)"></button>
      <button type="button" id="btn-filmstrip" title="胶片条 (T)" aria-label="胶片条 (T)"></button>
      <button type="button" id="btn-fullscreen" title="全屏 (Enter)" aria-label="全屏 (Enter)"></button>
      <button type="button" id="btn-more" title="更多操作" aria-label="更多操作" aria-haspopup="true" aria-expanded="false"></button>
    </div>

    <!-- 更多操作菜单（复制图片/文件、设为壁纸） -->
    <div id="more-menu" class="hidden" role="menu" aria-label="更多操作">
      <button type="button" role="menuitem" data-act="copy-image">复制图片<kbd>Ctrl+C</kbd></button>
      <button type="button" role="menuitem" data-act="copy-file">复制文件<kbd>Ctrl+Shift+C</kbd></button>
      <button type="button" role="menuitem" data-act="export">另存为 / 导出…<kbd>Ctrl+E</kbd></button>
      <button type="button" role="menuitem" data-act="wallpaper">设为桌面壁纸</button>
      <div class="menu-sep" role="separator"></div>
      <button type="button" role="menuitem" data-act="settings">设置…</button>
    </div>

    <!-- 取色探针（C 键开关） -->
    <div id="pixel-probe" class="hidden" aria-live="off">
      <span class="pp-swatch"></span><span class="pp-text"></span>
    </div>

    <!-- 左右翻页大按钮 -->
    <button type="button" id="nav-prev" class="nav-arrow" title="上一张 (←)" aria-label="上一张 (←)"></button>
    <button type="button" id="nav-next" class="nav-arrow" title="下一张 (→)" aria-label="下一张 (→)"></button>

    <!-- 右侧详细信息面板（非模态，不抢焦点） -->
    <aside id="details-panel" role="complementary" aria-label="图片详细信息">
      <div id="details-head">
        <h2 id="details-title">详细信息</h2>
        <button type="button" id="details-close" title="关闭 (D / Esc)" aria-label="关闭详细信息">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="details-body"></div>
      <div id="details-actions">
        <button type="button" id="details-copy-path" class="d-btn" aria-label="复制路径">复制路径</button>
        <button type="button" id="details-reveal" class="d-btn" aria-label="在资源管理器中显示">在资源管理器中显示</button>
      </div>
    </aside>

    <!-- 导出 / 另存为 -->
    <div id="export-backdrop" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="export-title">
        <h2 id="export-title" class="modal-title">另存为 / 导出</h2>
        <div class="modal-rows">
          <label class="modal-row">
            <span>格式</span>
            <select id="export-format">
              <option value="keep">保持原格式</option>
              <option value="jpeg">JPEG</option>
              <option value="png">PNG</option>
              <option value="webp">WebP（无损）</option>
            </select>
          </label>
          <label class="modal-row">
            <span>长边上限</span>
            <input id="export-max" type="number" min="64" max="30000" step="1" placeholder="留空 = 原尺寸" />
            <span class="modal-unit">px</span>
          </label>
          <label class="modal-row" id="export-quality-row">
            <span>JPEG 质量</span>
            <input id="export-quality" type="range" min="1" max="100" value="92" />
            <output id="export-quality-val">92</output>
          </label>
          <div class="modal-row">
            <span>保存到</span>
            <div class="modal-path">
              <button type="button" id="export-pick" class="d-btn">选择…</button>
              <span id="export-dest" class="modal-path-text"></span>
            </div>
          </div>
          <p id="export-note" class="modal-hint"></p>
        </div>
        <div class="modal-actions">
          <button type="button" id="export-cancel" class="d-btn">取消</button>
          <button type="button" id="export-ok" class="modal-primary">导出</button>
        </div>
      </div>
    </div>

    <!-- 设置 -->
    <div id="settings-backdrop" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h2 id="settings-title" class="modal-title">设置</h2>
        <div class="modal-rows">
          <label class="modal-row">
            <span>打开即灯箱</span>
            <input id="set-lightbox" type="checkbox" />
          </label>
          <label class="modal-row">
            <span>胶片条</span>
            <input id="set-filmstrip" type="checkbox" />
          </label>
          <label class="modal-row">
            <span>信息浮层</span>
            <input id="set-infobar" type="checkbox" />
          </label>
          <label class="modal-row">
            <span>排序方式</span>
            <select id="set-sort">
              <option value="name">名称 ↑</option>
              <option value="name_desc">名称 ↓</option>
              <option value="modified">修改时间</option>
              <option value="size">文件大小</option>
            </select>
          </label>
          <label class="modal-row">
            <span>主题</span>
            <select id="set-theme">
              <option value="dark">深色</option>
              <option value="light">浅色</option>
              <option value="system">跟随系统</option>
            </select>
          </label>
        </div>
        <p id="settings-hint" class="modal-hint"></p>
        <div class="modal-actions">
          <button type="button" id="settings-close" class="modal-primary">完成</button>
        </div>
      </div>
    </div>

    <!-- 通用确认对话框 -->
    <div id="dialog-backdrop" class="hidden">
      <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-msg">
        <div id="dialog-msg"></div>
        <input id="dialog-input" class="hidden" spellcheck="false" aria-labelledby="dialog-msg" />
        <div id="dialog-btns">
          <button type="button" id="dialog-cancel">取消</button>
          <button type="button" id="dialog-ok">确定</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
